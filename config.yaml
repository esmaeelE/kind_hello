# =============================================================================
# KinD (Kubernetes in Docker) — cluster configuration
# =============================================================================
# Defines a multi-node local Kubernetes cluster for development and testing.
#
# Create the cluster with:
#   kind create cluster --config config.yaml
#
# NOTE: this file intentionally shows a wide range of config fields with
#       comments — it is a "kitchen sink" example, not a particularly useful
#       config file for production. Trim it to what you need.
# =============================================================================

# KinD cluster API version — do not change unless upgrading KinD
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Name of the cluster (also becomes the kubectl context: "kind-multinode")
name: multinode

# -----------------------------------------------------------------------------
# kubeadmConfigPatches
# Raw YAML merged into the kubeadm-generated config before the nodes boot.
# Here we patch the kubelet configuration.
# -----------------------------------------------------------------------------
kubeadmConfigPatches:
  - |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    # Kubelet hard eviction thresholds.
    # Setting nodefs.available to "0%" effectively disables disk-based
    # eviction — handy for small local/dev machines, risky otherwise.
    evictionHard:
      nodefs.available: "0%"

# -----------------------------------------------------------------------------
# kubeadmConfigPatchesJSON6902
# Further patches applied in JSON 6902 format (op / path / value).
# -----------------------------------------------------------------------------
kubeadmConfigPatchesJSON6902:
  - group: kubeadm.k8s.io
    version: v1beta3
    kind: ClusterConfiguration
    # Add an extra Subject Alternative Name to the API server certificate,
    # so the API server can also be reached via "my-hostname".
    patch: |
      - op: add
        path: /apiServer/certSANs/-
        value: my-hostname

# -----------------------------------------------------------------------------
# nodes
# Topology of the cluster: 1 control-plane node + 3 worker nodes (4 total).
# -----------------------------------------------------------------------------
nodes:
  # --- Control-plane node -----------------------------------------------------
  - role: control-plane
    # Publish container ports on the host machine.
    # This is what makes the demo service reachable at localhost:30080 —
    # it must match the NodePort set in service.yaml (30080).
    extraPortMappings:
      - containerPort: 30080   # port opened inside the node container
        hostPort: 30080        # port published on your machine
        protocol: TCP

  # --- Worker nodes -----------------------------------------------------------
  # Three identical workers; pods from the deployment are spread across them.
  - role: worker
  - role: worker
  - role: worker

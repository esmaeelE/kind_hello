name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdownlint-cli2
      - run: markdownlint-cli2 "**/*.md"

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.1/kubeconform-linux-amd64 -o /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform
      - name: Validate manifests
        run: |
          for f in config.yaml deployment.yaml service.yaml config-test.yaml; do
            kubeconform -summary -f "$f" || exit 1
          done

  yaml-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c "import yaml, glob; [yaml.safe_load(open(f)) for f in glob.glob('*.yaml')]; print('All YAML parsable')"

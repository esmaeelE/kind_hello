# =============================================================================
# Nginx demo — Kubernetes Deployment
# =============================================================================
# Runs 3 replicas of nginx across the worker nodes.
#
# Apply with:
#   kubectl apply -f deployment.yaml
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  # Deployment name (shows up in `kubectl get deployments`)
  name: nginx-deployment
spec:
  # Number of pod replicas to keep running
  replicas: 3

  # --- Selector ---------------------------------------------------------------
  # Which pods this Deployment owns. Must match the template labels below.
  selector:
    matchLabels:
      app: nginx

  # --- Pod template -----------------------------------------------------------
  # The blueprint for every pod this Deployment creates.
  template:
    metadata:
      # Labels used by the selector and by the Service (service.yaml)
      # to route traffic to these pods.
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          # Nginx web server image (use a pinned tag in real projects,
          # e.g. nginx:1.27 — :latest is fine for demos only)
          image: nginx:latest
          ports:
            # Port exposed inside the pod; the Service forwards here.
            - containerPort: 80

          # --- Health probes -----------------------------------------------------
          # Ready only counts once nginx actually answers HTTP — so
          # `make status` shows 3/3 only when the app is really serving.
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3

          # Restarts the container if nginx stops answering (crash/hang).
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          # --- Resources ---------------------------------------------------------
          # Small demo-sized budget. Without these, one runaway pod could
          # starve the whole node — and pods would show no usage in
          # `kubectl top`/`describe`.
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
